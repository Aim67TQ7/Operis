[project]
name = "operis-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "httpx[socks]==0.28.1", "pydantic-settings==2.15.0", "uvicorn[standard]==0.52.4"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
