name: OPERIS Finance plugin checks
on:
  push:
    branches: [main, 'build/**']
    paths:
      - 'plugins/operis-finance/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/finance-plugin.yml'
  pull_request:
    paths:
      - 'plugins/operis-finance/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/finance-plugin.yml'
permissions:
  contents: read
jobs:
  finance-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s plugins/operis-finance/tests -v
